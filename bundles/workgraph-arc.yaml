# workgraph-arc — WorkGraph arc operation baseline
#
# First-class bundle for agents participating in Hub WorkGraph arcs.
# Agent-agnostic: no harness-specific fields, no tool names, no local path assumptions.
# Deployment systems resolve this bundle by reading the `skills:` list and copying each
# referenced SKILL.md tree from the pinned mission-kit source ref.

name: workgraph-arc
description: |
  Canonical end-to-end skill set for Hub WorkGraph arcs: intent capture, value/lifecycle
  sensemaking, bounded planning, exact admission and gates, controlled execution and repair,
  PR/delivery proof, participant discipline, terminal reconciliation, and progressive Director
  closeout. Selection is machine-checked against arc-lifecycle's canonical manifests.

skills:
  - arc-lifecycle
  - survey
  - workgraph-arc-planning
  - workgraph-arc-operator
  - workgraph-arc-participant
  - workgraph-verification-gates
  - workgraph-pr-delivery
  - workgraph-recovery
  - workgraph-arc-closeout
