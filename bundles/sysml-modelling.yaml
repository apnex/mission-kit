# sysml-modelling — read + author SysML v2 models as an agent
#
# Bundles compose skills into operator-facing roles. Agent-agnostic: no harness-specific
# fields, no tool names. Any agent that consumes SKILL.md trees can resolve this by its `skills:` list.
#
# The catalogue is a HIERARCHY expressed as edges, not numbered names. Each skill declares
# `prerequisite:` (what to read first) and, for a composed system, `composes:` (the primitives it is
# built from). "Level" is DERIVED from those edges (root -> primitives -> composed systems), never
# stored in a name. Order below follows that derived depth.

name: sysml-modelling
description: |
  Read and author SysML v2 models. Start with sysml-literacy (read + understand any model), then use the
  model-a-X primitives to author specific constructs, then compose them into specialist systems. The base for
  digital-twinning designs in an unambiguous, queryable format: model the structure, keep prose for judgment.

  Use when reading, reasoning over, or authoring SysML v2 — components, state machines, workflows, dependency
  graphs, constraints, and (as the catalogue grows) composite systems like an arc.

skills:
  # --- root: literacy (read any model) ---
  - sysml-literacy            # READ + understand any model — prerequisite for everything below

  # --- primitives: author one SysML construct family each (copy the model-a-state-machine shape) ---
  - model-a-state-machine     # AUTHOR a lifecycle / FSM (state def) — the template for the rest
  - model-a-workflow          # AUTHOR an ordered activity (action def) — successions, decisions, recursion/cascade
  - model-a-component         # AUTHOR a structural breakdown (part def / item def) — attributes, refs vs parts, :> /:>>
  #   model-a-dependency-graph ref edges forming a DAG over typed nodes
  #   model-a-constraint       constraint def — invariants, asserted + reused
  #   model-a-classification   enum axes + the orthogonality discipline

  # --- composed systems (declare `composes:` over the primitives they are built from) ---
  #   model-an-arc            composes {state-machine, dependency-graph, constraint, classification, workflow}
  #                           — read/author the arc MODEL; the operate facet is the arc-lifecycle skill (K6).

  # --- meta: build + verify catalogue skills (for catalogue AUTHORS; adjacent to the spine) ---
  - sysml-skill-builder       # BUILD a modelling skill (the artifact grammar); composes component + workflow -> L2
  - sysml-skill-tester        # VERIFY a modelling skill (the acceptance bar)
